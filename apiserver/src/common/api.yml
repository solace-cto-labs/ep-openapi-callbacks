components:
  schemas:
    SubscribeRequest:
      type: object
      properties:
        callbackUrl:
          type: string
        authenticationType:
          type: string
          enum:
            - none
            - http-basic
            - http-header
            - oauth-client
        authenticationHttpBasicPassword:
          type: string
        authenticationHttpBasicUsername:
          type: string
        authenticationHttpHeaderName:
          type: string
        authenticationHttpHeaderValue:
          type: string
        authenticationOauthClientTokenEndpoint:
          type: string
        authenticationOauthClientId:
          type: string
        authenticationOauthClientSecret:
          type: string
        authenticationOauthClientScope:
          type: array
          items:
            type: string
      required:
        - callbackUrl
        - authenticationType
      additionalProperties: false
    SubscribeSuccessResponse:
      type: object
      properties:
        subscriptionTopic:
          type: string
        callbackId:
          type: string
      required:
        - subscriptionTopic
        - callbackId
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errorId:
          type: string
      required:
        - message
        - errorId
      additionalProperties: false
    UnSubscribeSuccessResponse:
      type: object
      properties:
        subscriptionTopic:
          type: string
      required:
        - subscriptionTopic
      additionalProperties: false
    Order_Event_Schema:
      description: Order that must be picked in a retail store for a customer
      title: Order
      type: object
      required:
        - createdAt
        - customerId
        - customerName
        - id
        - metaInfo
        - selectedItems
        - storeId
        - storeName
        - version
      properties:
        createdAt:
          format: date-time
          description: Timestamp this order was created..
          type: string
          x-parser-schema-id: <anonymous-schema-1>
        customerId:
          minLength: 0
          pattern: '[a-zA-Z0-9]+'
          description: Id of the customer
          type: string
          maxLength: 255
          required:
            - 'true'
          example: abc123
          x-parser-schema-id: <anonymous-schema-2>
        storeName:
          minLength: 0
          pattern: '[a-zA-Z0-9\- ]+'
          description: Name of the store
          type: string
          maxLength: 255
          required:
            - 'true'
          example: abc123
          x-parser-schema-id: <anonymous-schema-3>
        id:
          minLength: 0
          pattern: '[a-zA-Z0-9]+'
          description: Id of the object
          type: string
          maxLength: 255
          required:
            - 'true'
          example: abc123
          x-parser-schema-id: <anonymous-schema-4>
        storeId:
          minLength: 0
          pattern: '[a-zA-Z0-9]+'
          description: Id of the store
          type: string
          maxLength: 255
          required:
            - 'true'
          example: abc123
          x-parser-schema-id: <anonymous-schema-5>
        version:
          format: int64
          maximum: 999999999
          description: Version number that is incremented with each change of
          type: integer
          minimum: 1
          required:
            - 'true'
          example: 1
          x-parser-schema-id: <anonymous-schema-6>
        customerName:
          minLength: 0
          pattern: '[a-zA-Z0-9\- ]+'
          description: Name of the customer
          type: string
          maxLength: 255
          required:
            - 'true'
          example: abc123
          x-parser-schema-id: <anonymous-schema-7>
        selectedItems:
          type: array
          items:
            type: object
            properties:
              quantity:
                format: int64
                maximum: 999999999
                type: integer
                minimum: 0
                x-parser-schema-id: <anonymous-schema-10>
              id:
                minLength: 1
                type: string
                maxLength: 255
                x-parser-schema-id: <anonymous-schema-11>
              productName:
                minLength: 1
                type: string
                maxLength: 255
                x-parser-schema-id: <anonymous-schema-12>
            required:
              - id
              - productName
              - quantity
            x-parser-schema-id: <anonymous-schema-9>
          x-parser-schema-id: <anonymous-schema-8>
        status:
          type: string
          enum:
            - ORDER_RECEIVED
            - ORDER_ACCEPTED
            - CUSTOMER_REVIEW_REQUIRED
            - IN_PROGRESS
            - CUSTOMER_ACCEPTANCE_REQUIRED
            - COMPLETED
            - CANCELED
            - SHIPPED
          x-parser-schema-id: <anonymous-schema-13>
      x-parser-schema-id: Order_Event_Schema
